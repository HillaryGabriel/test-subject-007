name: Cross-platform validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install application and analysis extras
        run: python -m pip install -e ".[analysis]"
      - name: Check engine installation
        run: python -m test_subject_007 --doctor
      - name: Run all tests on Linux (no skipped tests allowed)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/run_tests.py --require-all
      - name: Run all tests on Windows (no skipped tests allowed)
        if: runner.os == 'Windows'
        run: python scripts/run_tests.py --require-all
